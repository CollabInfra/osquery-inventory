[linux_debian]
debian-server ansible_host=192.168.1.10 ansible_user=admin

[linux_redhat]
centos-server ansible_host=192.168.1.20 ansible_user=admin
rhel-server ansible_host=192.168.1.21 ansible_user=admin

[macos]
mac-workstation ansible_host=192.168.1.30 ansible_user=admin

[windows]
win-server ansible_host=192.168.1.40 ansible_user=administrator ansible_connection=winrm ansible_winrm_transport=ntlm

[linux:children]
linux_debian
linux_redhat

[all:vars]
ansible_python_interpreter=/usr/bin/python3
