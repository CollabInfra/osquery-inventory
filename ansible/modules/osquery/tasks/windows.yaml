---
# OSQuery installation for Windows
- name: Download OSQuery MSI installer
  ansible.windows.win_get_url:
    url: https://pkg.osquery.io/windows/osquery-5.11.0.msi
    dest: C:\Windows\Temp\osquery.msi

- name: Install OSQuery
  ansible.windows.win_package:
    path: C:\Windows\Temp\osquery.msi
    state: present
    arguments: /quiet /norestart

- name: Create OSQuery log directory
  ansible.windows.win_file:
    path: "{{ osquery_log_dir }}"
    state: directory

- name: Deploy OSQuery configuration
  ansible.windows.win_template:
    src: osquery-windows.conf.j2
    dest: C:\Program Files\osquery\osquery.conf
  notify: restart osquery windows

- name: Ensure OSQuery service is running
  ansible.windows.win_service:
    name: osqueryd
    start_mode: auto
    state: started

# Include Fluent Bit installation tasks
- name: Include Fluent Bit tasks
  include_tasks: fluent-bit-windows.yaml
