<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails Extension - OSQuery Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .extension-header {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
        }
        
        .extension-title {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .extension-title h2 {
            margin: 0;
            color: var(--primary-color);
        }
        
        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .badge.verified {
            background: #28a745;
            color: white;
        }
        
        .badge.unverified {
            background: #6c757d;
            color: white;
        }
        
        .extension-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .meta-item {
            display: flex;
            flex-direction: column;
        }
        
        .meta-item label {
            font-size: 0.85rem;
            color: var(--text-light);
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .meta-item value {
            font-size: 1rem;
            color: var(--text-color);
        }
        
        .version-section {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
        }
        
        .version-section h3 {
            margin: 0 0 20px 0;
            color: var(--primary-color);
        }
        
        .version-card {
            background: var(--bg-color);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid var(--border-color);
        }
        
        .version-card.latest {
            border-left-color: #28a745;
        }
        
        .version-card.outdated {
            border-left-color: #ffc107;
        }
        
        .version-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .version-header h4 {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .installations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 10px;
        }
        
        .installation-item {
            background: white;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        
        .installation-item strong {
            color: var(--primary-color);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: var(--text-light);
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        
        .marketplace-versions {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: var(--shadow);
        }
        
        .marketplace-versions h3 {
            margin: 0 0 20px 0;
            color: var(--primary-color);
        }
        
        .marketplace-version-item {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .marketplace-version-item:last-child {
            border-bottom: none;
        }
        
        .date {
            color: var(--text-light);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>📦 Détails de l'Extension</h1>
                <p id="extension-id-display">Chargement...</p>
            </div>
            <a href="/vscode-extensions" class="btn">← Retour à la liste</a>
        </header>

        <div id="error-message" class="error" style="display: none;"></div>
        <div id="loading" class="loading">Chargement des détails...</div>

        <div id="extension-content" style="display: none;">
            <!-- Extension Header -->
            <div class="extension-header">
                <div class="extension-title">
                    <h2 id="display-name">-</h2>
                    <span id="verified-badge"></span>
                </div>
                <p id="description">-</p>
                
                <div class="extension-meta">
                    <div class="meta-item">
                        <label>Publisher</label>
                        <value id="publisher">-</value>
                    </div>
                    <div class="meta-item">
                        <label>Extension ID</label>
                        <value id="extension-id">-</value>
                    </div>
                    <div class="meta-item">
                        <label>Dernière version</label>
                        <value id="latest-version">-</value>
                    </div>
                    <div class="meta-item">
                        <label>Mise à jour</label>
                        <value id="last-updated">-</value>
                    </div>
                    <div class="meta-item">
                        <label>Installations Marketplace</label>
                        <value id="marketplace-installs">-</value>
                    </div>
                    <div class="meta-item">
                        <label>Installations trouvées</label>
                        <value id="total-installations">-</value>
                    </div>
                </div>
            </div>

            <!-- Versions Found -->
            <div class="version-section">
                <h3>Versions installées sur vos machines</h3>
                <div id="versions-container"></div>
            </div>

            <!-- Marketplace Versions -->
            <div class="marketplace-versions" id="marketplace-versions-section" style="display: none;">
                <h3>Dernières versions disponibles sur le Marketplace</h3>
                <div id="marketplace-versions-container"></div>
            </div>
        </div>
    </div>

    <script>
        // Extract publisher and name from URL path
        const pathParts = window.location.pathname.split('/');
        const publisher = pathParts[pathParts.length - 2];
        const extensionName = pathParts[pathParts.length - 1];
        
        // Load extension details
        async function loadExtensionDetails() {
            try {
                const response = await fetch(`/api/vscode-extension/${extensionName}`);
                
                if (!response.ok) {
                    throw new Error('Extension non trouvée');
                }
                
                const data = await response.json();
                displayExtensionDetails(data);
                
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                const errorDiv = document.getElementById('error-message');
                errorDiv.textContent = `Erreur: ${error.message}`;
                errorDiv.style.display = 'block';
            }
        }
        
        function displayExtensionDetails(data) {
            // Hide loading
            document.getElementById('loading').style.display = 'none';
            document.getElementById('extension-content').style.display = 'block';
            
            // Update header
            document.getElementById('extension-id-display').textContent = data.extension_id;
            document.getElementById('display-name').textContent = data.displayName || data.name;
            document.getElementById('description').textContent = data.shortDescription || 'Pas de description disponible';
            
            // Verified badge
            const verifiedBadge = document.getElementById('verified-badge');
            if (data.isVerified) {
                verifiedBadge.innerHTML = '<span class="badge verified">✓ Vérifié</span>';
            } else {
                verifiedBadge.innerHTML = '<span class="badge unverified">Non vérifié</span>';
            }
            
            // Meta info
            document.getElementById('publisher').textContent = data.publisher;
            document.getElementById('extension-id').textContent = data.extension_id;
            document.getElementById('latest-version').textContent = data.latestVersion || 'Inconnue';
            document.getElementById('last-updated').textContent = data.lastUpdated ? 
                new Date(data.lastUpdated).toLocaleDateString('fr-FR') : 'Inconnue';
            document.getElementById('marketplace-installs').textContent = 
                data.marketplaceInstalls ? data.marketplaceInstalls.toLocaleString('fr-FR') : '0';
            document.getElementById('total-installations').textContent = data.total_installations;
            
            // Display versions
            displayVersions(data.versions, data.latestVersion);
            
            // Display marketplace versions
            if (data.allVersions && data.allVersions.length > 0) {
                displayMarketplaceVersions(data.allVersions);
            }
        }
        
        function displayVersions(versions, latestVersion) {
            const container = document.getElementById('versions-container');
            container.innerHTML = '';
            
            versions.forEach(versionData => {
                const isLatest = versionData.is_latest;
                const card = document.createElement('div');
                card.className = `version-card ${isLatest ? 'latest' : 'outdated'}`;
                
                const badge = isLatest ? 
                    '<span class="badge uptodate">✓ À jour</span>' : 
                    '<span class="badge outdated">⚠ Outdated</span>';
                
                const installationsHtml = versionData.installations.map(inst => `
                    <div class="installation-item">
                        <strong>${inst.hostname}</strong> - ${inst.username}<br>
                        <small>${inst.path}</small><br>
                        <small class="date">Vu: ${new Date(inst.last_seen).toLocaleString('fr-FR')}</small>
                    </div>
                `).join('');
                
                card.innerHTML = `
                    <div class="version-header">
                        <h4>
                            Version ${versionData.version}
                            ${badge}
                        </h4>
                        <span>${versionData.installation_count} installation(s)</span>
                    </div>
                    <div class="installations-grid">
                        ${installationsHtml}
                    </div>
                `;
                
                container.appendChild(card);
            });
        }
        
        function displayMarketplaceVersions(versions) {
            const section = document.getElementById('marketplace-versions-section');
            const container = document.getElementById('marketplace-versions-container');
            
            section.style.display = 'block';
            container.innerHTML = '';
            
            versions.forEach(version => {
                const item = document.createElement('div');
                item.className = 'marketplace-version-item';
                
                const lastUpdated = version.lastUpdated ? 
                    new Date(version.lastUpdated).toLocaleDateString('fr-FR') : 'Date inconnue';
                
                item.innerHTML = `
                    <span><strong>Version ${version.version}</strong></span>
                    <span class="date">${lastUpdated}</span>
                `;
                
                container.appendChild(item);
            });
        }
        
        // Load on page load
        loadExtensionDetails();
    </script>
</body>
</html>
