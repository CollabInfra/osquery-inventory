<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homebrew Packages - OSQuery Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .package-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        
        .package-table th {
            background: var(--primary-color);
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .package-table td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .package-table tr:hover {
            background: var(--bg-color);
        }
        
        .package-table tr:last-child td {
            border-bottom: none;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .badge-outdated {
            background: #fef2f2;
            color: var(--danger-color);
        }
        
        .badge-uptodate {
            background: #f0fdf4;
            color: var(--success-color);
        }
        
        .badge-deprecated {
            background: #fef3c7;
            color: #d97706;
        }
        
        .badge-disabled {
            background: #f3f4f6;
            color: #6b7280;
        }
        
        .package-name {
            font-weight: 600;
            color: var(--primary-color);
        }
        
        .package-desc {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .version-compare {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 0.875rem;
        }
        
        .version-installed {
            font-weight: 600;
        }
        
        .version-latest {
            color: var(--text-secondary);
        }
        
        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .table-container {
            overflow-x: auto;
            max-height: 70vh;
            overflow-y: auto;
        }
        
        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 16px;
            background: white;
            border-radius: 8px;
            box-shadow: var(--shadow);
        }
        
        .stat-item {
            display: flex;
            flex-direction: column;
        }
        
        .stat-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 600;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
        }
        
        .nav-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
        
        .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>🍺 Homebrew Packages</h1>
                <p><a href="/" class="nav-link">← Retour au Dashboard</a></p>
            </div>
            <div class="health-status" id="healthStatus">
                <span class="status-indicator" id="statusIndicator"></span>
                <span id="statusText">Chargement...</span>
            </div>
        </header>

        <!-- Statistics -->
        <div class="stats-bar">
            <div class="stat-item">
                <span class="stat-label">Total Packages</span>
                <span class="stat-value" id="totalPackages">-</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Outdated</span>
                <span class="stat-value" id="outdatedCount" style="color: var(--danger-color);">-</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Deprecated</span>
                <span class="stat-value" id="deprecatedCount" style="color: #d97706;">-</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Hosts</span>
                <span class="stat-value" id="hostsCount">-</span>
            </div>
        </div>

        <!-- Filters -->
        <section class="search-section">
            <h2>Filtrer les packages</h2>
            <div class="filter-bar">
                <input type="text" id="searchFilter" placeholder="Rechercher un package..." class="search-input" style="flex: 1;">
                <select id="hostFilter" class="filter-select">
                    <option value="">Tous les hôtes</option>
                </select>
                <select id="statusFilter" class="filter-select">
                    <option value="">Tous les statuts</option>
                    <option value="outdated">Outdated</option>
                    <option value="uptodate">Up-to-date</option>
                    <option value="deprecated">Deprecated</option>
                    <option value="disabled">Disabled</option>
                </select>
                <button onclick="applyFilters()" class="btn-primary">Appliquer</button>
            </div>
        </section>

        <!-- Packages Table -->
        <section class="search-section">
            <div class="results-header">
                <h2>Packages installés</h2>
                <span id="displayCount" class="results-count"></span>
            </div>
            
            <div id="loadingIndicator" class="loading">Chargement des packages...</div>
            
            <div id="tableContainer" class="table-container" style="display: none;">
                <table class="package-table">
                    <thead>
                        <tr>
                            <th>Hôte</th>
                            <th>Package</th>
                            <th>Description</th>
                            <th>Version Installée</th>
                            <th>Version Disponible</th>
                            <th>Statut</th>
                            <th>Licence</th>
                            <th>Homepage</th>
                        </tr>
                    </thead>
                    <tbody id="packagesTableBody">
                    </tbody>
                </table>
            </div>
            
            <div id="errorContainer" class="error" style="display: none;"></div>
        </section>
    </div>

    <script src="{{ url_for('static', filename='homebrew.js') }}"></script>
</body>
</html>
