[tool.poetry]
name = "osquery-dashboard"
version = "1.0.0"
description = "Web dashboard for querying and visualizing OSQuery data from OpenSearch"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = "^3.10"
flask = "^3.0.0"
opensearch-py = "^2.4.2"
python-dotenv = "^1.0.0"
gunicorn = "^21.2.0"
requests = "^2.31.0"
boto3 = "^1.34.34"
requests-aws4auth = "^1.2.3"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.12.0"
flake8 = "^7.3.0"
mypy = "^1.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
